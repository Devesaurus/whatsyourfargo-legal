<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email confirmed · WhatsYourFargo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4fc3f7;
        --ok: #3fb950;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(ellipse at top, #1a2330 0%, var(--bg) 55%);
        color: var(--text);
      }
      .card {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .check {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(63, 185, 80, 0.15);
        color: var(--ok);
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .steps {
        text-align: left;
        margin: 18px 0 0;
        padding: 14px 14px 14px 32px;
        background: #0f1419;
        border-radius: 12px;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .steps li {
        margin: 8px 0;
        color: var(--muted);
      }
      .steps strong {
        color: var(--text);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="check" aria-hidden="true">✓</div>
      <h1>Email confirmed</h1>
      <p>Your WhatsYourFargo account is verified.</p>
      <ol class="steps">
        <li>Open the <strong>WhatsYourFargo</strong> app</li>
        <li>Go to the <strong>Account</strong> tab</li>
        <li><strong>Sign in</strong> with the same email and password</li>
      </ol>
      <p style="margin-top: 18px; margin-bottom: 0">
        You can close this page.
      </p>
    </main>
  </body>
</html>
